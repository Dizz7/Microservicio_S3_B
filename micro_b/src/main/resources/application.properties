spring.application.name=micro_b

# Forzar codificación UTF-8 global para peticiones y respuestas JSON
# Para evitar problemas de codificación de caracteres en los microservicios, 
# se establece la codificación UTF-8 para todas las solicitudes y respuestas JSON.

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true



# Se configura el puerto del servidor para que sea 8081 para 
# evitar conflictos con otros microservicios que puedan 
# estar corriendo en el mismo host (Usuarios puerto 8080).
server.port=8081


# Configuración de la base de datos Oracle cloud

# Configuración de los niveles de log para diferentes paquetes y clases
logging.level.root=INFO
logging.level.org.hibernate=DEBUG
logging.level.org.springframework=DEBUG

# Datos desde wallet de Oracle Cloud
# Por razones educativas, las credenciales de la base de datos se encuentran en este archivo, pero en un entorno de producción,
# se recomienda utilizar un archivo de configuración externo o variables de entorno para proteger la información sensible.

spring.datasource.url=jdbc:oracle:thin:@f35qhf3fozc81p00_tp?TNS_ADMIN=/Users/dani/Wallet_F35QHF3FOZC81P00
spring.datasource.username=FS1_S6B
spring.datasource.password=ClaseFullStack1-
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Permite crear las tablas faltantes al iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Configuración de HikariCP para la conexión a la base de datos
spring.datasource.hikari.maximum-pool-size= 10
# Configuración del tiempo de espera para obtener una conexión del pool de conexiones HikariCP
spring.datasource.hikari.connection-timeout= 30000